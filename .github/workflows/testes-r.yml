name: Testes R (base)

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Executar testes
        run: Rscript tests/test_qualidade_fontes.R
      - name: Diagnostico de fontes
        run: Rscript R/01_diagnostico.R
